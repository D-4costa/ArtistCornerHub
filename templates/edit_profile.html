
{% extends "base.html" %}

{% block title %}Edit Artist Profile - Artist Corner Hub{% endblock %}

{% block content %}
<section class="form-container">

    <h1>Edit Your Artist Profile</h1>
    <p class="form-description">
        Update your information whenever you need.
    </p>

    <form method="POST" action="{{ url_for('edit_artist_profile') }}">

        <div class="form-group">
            <label for="full_name">Artist Name</label>
            <input
                type="text"
                id="full_name"
                name="full_name"
                value="{{ profile.full_name or '' }}"
                required
            >
        </div>

        <div class="form-group">
            <label for="biography">Biography</label>
            <textarea
                id="biography"
                name="biography"
                rows="4"
            >{{ profile.biography or '' }}</textarea>
        </div>

        <div class="form-group">
            <label for="skills">Skills</label>
            <input
                type="text"
                id="skills"
                name="skills"
                value="{{ profile.skills or '' }}"
            >
        </div>

        <div class="form-group">
            <label for="interests">Interests</label>
            <textarea
                id="interests"
                name="interests"
                rows="3"
            >{{ profile.interests or '' }}</textarea>
        </div>

        <div class="form-group">
            <label for="profile_image">Profile Image URL</label>
            <input
                type="url"
                id="profile_image"
                name="profile_image"
                value="{{ profile.profile_image or '' }}"
            >
        </div>

        <button type="submit" class="btn-primary">
            Save Changes
        </button>

    </form>

    <a href="{{ url_for('artist_profile_page') }}" class="back-link">
        Cancel
    </a>

</section>
{% endblock %}
